almanach_studio_version: 1
theme: brutalist
paperWidth: 384
bodyScale: 1
feedLines: 8
blocks:
  - id: head
    type: banner
    data: { text: "RAGOPT-001 / STEP 26", right: "FREEZE", pad: "m" }
  - id: gap1
    type: space
    data: { size: "s" }
  - id: title
    type: text
    data: { text: "ONE TEXT MUTATION. NO EXCUSES.", preset: h1, lines: 3 }
  - id: rule1
    type: rule
    data: { weight: heavy }
  - id: facts
    type: kv
    data:
      items:
        - ["CANDIDATE", "SOURCE-ROLE ROUTING"]
        - ["MUTABLE ASSETS", "1"]
        - ["CORPUS / INDEX", "LOCKED"]
        - ["MODEL / JUDGE", "LOCKED"]
        - ["PROVIDER CALLS", "0"]
        - ["WORKTREES", "CLEAN"]
  - id: result
    type: banner
    data: { text: "NEXT / COMMIT FROZEN BUNDLE", pad: "m" }
  - id: note
    type: text
    data: { text: "GEC owns the startup injection seam and native tool-input evidence. RAGOPT owns custody, pairing, gates, and the decision.", preset: body }
